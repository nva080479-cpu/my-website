<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR trên trình duyệt</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #646d7e;
    --line: #d9dde5; --accent: #1f5eff; --accent-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --text: #e8ebf1; --muted: #98a1b3;
      --line: #2e3440; --accent: #6b94ff; --accent-text: #0c1020;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px;
  }
  #drop {
    border: 2px dashed var(--line); border-radius: 8px; min-height: 240px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); cursor: pointer; padding: 12px;
  }
  #drop.over { border-color: var(--accent); }
  #drop:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  #preview { max-width: 100%; max-height: 360px; display: none; border-radius: 6px; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  select, button {
    font: inherit; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  progress { width: 100%; height: 8px; margin-top: 12px; display: none; }
  #status { color: var(--muted); font-size: .9rem; margin-top: 8px; min-height: 1.4em; }
  textarea {
    width: 100%; min-height: 300px; resize: vertical; font: inherit;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px;
  }
</style>
</head>
<body>
<main>
  <h1>Trích xuất chữ từ ảnh</h1>
  <p class="sub">Xử lý hoàn toàn trên máy bạn. Ảnh không được gửi đi đâu.</p>

  <div class="grid">
    <section class="panel">
      <div id="drop" tabindex="0" role="button" aria-label="Chọn hoặc thả ảnh">
        <span id="hint">Nhấn, kéo thả hoặc dán (Ctrl+V) ảnh vào đây</span>
        <img id="preview" alt="Ảnh đã chọn">
      </div>
      <input id="file" type="file" accept="image/*" hidden>
      <div class="row">
        <select id="lang" aria-label="Ngôn ngữ">
          <option value="vie">Tiếng Việt</option>
          <option value="eng">English</option>
          <option value="vie+eng">Việt + Anh</option>
        </select>
        <select id="psm" aria-label="Kiểu bố cục">
          <option value="3">Bố cục tự động</option>
          <option value="6" selected>Một khối chữ (thường tốt nhất)</option>
          <option value="7">Một dòng duy nhất</option>
        </select>
        <button id="run" class="primary" disabled>Nhận dạng chữ</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="pre" checked> Tiền xử lý ảnh</label>
        <label>Độ nhạy nét chữ
          <input type="range" id="sens" min="4" max="30" value="12">
        </label>
      </div>
      <details id="dbg" style="margin-top:12px">
        <summary>Xem ảnh sau xử lý</summary>
        <canvas id="cv" style="max-width:100%;margin-top:8px;border:1px solid var(--line)"></canvas>
      </details>
      <progress id="bar" max="1" value="0"></progress>
      <div id="status" aria-live="polite"></div>
    </section>

    <section class="panel">
      <textarea id="out" placeholder="Kết quả sẽ hiện ở đây" aria-label="Kết quả"></textarea>
      <div class="row">
        <button id="copy" disabled>Sao chép</button>
        <button id="save" disabled>Tải về .txt</button>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), preview = $('preview');
const runBtn = $('run'), out = $('out'), bar = $('bar'), status = $('status');
let image = null;

function setImage(file) {
  if (!file || !file.type.startsWith('image/')) {
    status.textContent = 'Hãy chọn một file ảnh (PNG, JPG, WebP...).';
    return;
  }
  image = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  $('hint').style.display = 'none';
  runBtn.disabled = false;
  status.textContent = '';
}

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
});
fileInput.addEventListener('change', () => setImage(fileInput.files[0]));
['dragover', 'dragenter'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => setImage(e.dataTransfer.files[0]));
document.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) setImage(item.getAsFile());
});

// Phóng to, chuyển xám, kéo giãn tương phản, rồi nhị phân hoá thích ứng
// (so từng điểm ảnh với trung bình vùng xung quanh nên chịu được ánh sáng không đều)
async function preprocess(file, sens) {
  const bmp = await createImageBitmap(file);
  const long = Math.max(bmp.width, bmp.height);
  const scale = long < 1600 ? Math.min(3, 1600 / long) : long > 3200 ? 3200 / long : 1;
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  const cv = $('cv');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(bmp, 0, 0, w, h);
  const img = ctx.getImageData(0, 0, w, h), d = img.data;

  const gray = new Uint8ClampedArray(w * h);
  let lo = 255, hi = 0;
  for (let i = 0; i < gray.length; i++) {
    const g = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
    gray[i] = g; if (g < lo) lo = g; if (g > hi) hi = g;
  }
  const range = Math.max(1, hi - lo);
  for (let i = 0; i < gray.length; i++) gray[i] = (gray[i] - lo) * 255 / range;

  // ảnh tích phân để tính trung bình cửa sổ nhanh
  const W = w + 1, integ = new Uint32Array(W * (h + 1));
  for (let y = 0; y < h; y++) {
    let row = 0;
    for (let x = 0; x < w; x++) {
      row += gray[y * w + x];
      integ[(y + 1) * W + x + 1] = integ[y * W + x + 1] + row;
    }
  }
  const r = Math.max(8, Math.round(Math.min(w, h) / 24));
  for (let y = 0; y < h; y++) {
    const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
    for (let x = 0; x < w; x++) {
      const x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
      const sum = integ[y1 * W + x1] - integ[y0 * W + x1] - integ[y1 * W + x0] + integ[y0 * W + x0];
      const mean = sum / ((x1 - x0) * (y1 - y0));
      const v = gray[y * w + x] < mean - sens ? 0 : 255;
      const k = (y * w + x) * 4;
      d[k] = d[k + 1] = d[k + 2] = v; d[k + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return cv;
}

runBtn.addEventListener('click', async () => {
  if (!image) return;
  runBtn.disabled = true;
  out.value = '';
  bar.style.display = 'block'; bar.value = 0;
  try {
    let input = image;
    if ($('pre').checked) {
      status.textContent = 'Đang xử lý ảnh...';
      input = await preprocess(image, +$('sens').value);
    }
    const worker = await Tesseract.createWorker($('lang').value, 1, {
      logger: m => {
        if (m.status === 'recognizing text') bar.value = m.progress;
        status.textContent = m.status === 'recognizing text'
          ? `Đang nhận dạng... ${Math.round(m.progress * 100)}%`
          : 'Đang tải dữ liệu ngôn ngữ (lần đầu sẽ hơi lâu)...';
      }
    });
    await worker.setParameters({
      tessedit_pageseg_mode: $('psm').value,
      preserve_interword_spaces: '1'
    });
    const { data } = await worker.recognize(input);
    await worker.terminate();
    out.value = data.text.trim();
    status.textContent = `Xong. Độ tin cậy trung bình: ${Math.round(data.confidence)}%`;
    $('copy').disabled = $('save').disabled = !out.value;
  } catch (err) {
    status.textContent = 'Lỗi: ' + err.message + '. Kiểm tra kết nối mạng và thử lại.';
  } finally {
    runBtn.disabled = false;
    bar.style.display = 'none';
  }
});

$('copy').addEventListener('click', async () => {
  await navigator.clipboard.writeText(out.value);
  status.textContent = 'Đã sao chép.';
});
$('save').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out.value], { type: 'text/plain;charset=utf-8' }));
  a.download = 'ocr.txt';
  a.click();
});
</script>
</body>
</html>
