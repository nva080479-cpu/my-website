<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCR trên trình duyệt</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #646d7e;
    --line: #d9dde5; --accent: #1f5eff; --accent-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1c2028; --text: #e8ebf1; --muted: #98a1b3;
      --line: #2e3440; --accent: #6b94ff; --accent-text: #0c1020;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px;
  }
  #drop {
    border: 2px dashed var(--line); border-radius: 8px; min-height: 240px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--muted); cursor: pointer; padding: 12px;
  }
  #drop.over { border-color: var(--accent); }
  #drop:focus-visible, button:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  #preview { max-width: 100%; max-height: 360px; display: none; border-radius: 6px; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  select, button {
    font: inherit; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  progress { width: 100%; height: 8px; margin-top: 12px; display: none; }
  #status { color: var(--muted); font-size: .9rem; margin-top: 8px; min-height: 1.4em; }
  textarea {
    width: 100%; min-height: 300px; resize: vertical; font: inherit;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px;
  }
</style>
</head>
<body>
<main>
  <h1>Trích xuất chữ từ ảnh</h1>
  <p class="sub">Xử lý hoàn toàn trên máy bạn. Ảnh không được gửi đi đâu.</p>

  <div class="grid">
    <section class="panel">
      <div id="drop" tabindex="0" role="button" aria-label="Chọn hoặc thả ảnh">
        <span id="hint">Nhấn, kéo thả hoặc dán (Ctrl+V) ảnh vào đây</span>
        <img id="preview" alt="Ảnh đã chọn">
      </div>
      <input id="file" type="file" accept="image/*" hidden>
      <div class="row">
        <select id="lang" aria-label="Ngôn ngữ">
          <option value="vie">Tiếng Việt</option>
          <option value="eng">English</option>
          <option value="vie+eng">Việt + Anh</option>
        </select>
        <button id="run" class="primary" disabled>Nhận dạng chữ</button>
      </div>
      <progress id="bar" max="1" value="0"></progress>
      <div id="status" aria-live="polite"></div>
    </section>

    <section class="panel">
      <textarea id="out" placeholder="Kết quả sẽ hiện ở đây" aria-label="Kết quả"></textarea>
      <div class="row">
        <button id="copy" disabled>Sao chép</button>
        <button id="save" disabled>Tải về .txt</button>
      </div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), fileInput = $('file'), preview = $('preview');
const runBtn = $('run'), out = $('out'), bar = $('bar'), status = $('status');
let image = null;

function setImage(file) {
  if (!file || !file.type.startsWith('image/')) {
    status.textContent = 'Hãy chọn một file ảnh (PNG, JPG, WebP...).';
    return;
  }
  image = file;
  preview.src = URL.createObjectURL(file);
  preview.style.display = 'block';
  $('hint').style.display = 'none';
  runBtn.disabled = false;
  status.textContent = '';
}

drop.addEventListener('click', () => fileInput.click());
drop.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
});
fileInput.addEventListener('change', () => setImage(fileInput.files[0]));
['dragover', 'dragenter'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => setImage(e.dataTransfer.files[0]));
document.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) setImage(item.getAsFile());
});

runBtn.addEventListener('click', async () => {
  if (!image) return;
  runBtn.disabled = true;
  out.value = '';
  bar.style.display = 'block'; bar.value = 0;
  try {
    const worker = await Tesseract.createWorker($('lang').value, 1, {
      logger: m => {
        if (m.status === 'recognizing text') bar.value = m.progress;
        status.textContent = m.status === 'recognizing text'
          ? `Đang nhận dạng... ${Math.round(m.progress * 100)}%`
          : 'Đang tải dữ liệu ngôn ngữ (lần đầu sẽ hơi lâu)...';
      }
    });
    const { data } = await worker.recognize(image);
    await worker.terminate();
    out.value = data.text.trim();
    status.textContent = `Xong. Độ tin cậy trung bình: ${Math.round(data.confidence)}%`;
    $('copy').disabled = $('save').disabled = !out.value;
  } catch (err) {
    status.textContent = 'Lỗi: ' + err.message + '. Kiểm tra kết nối mạng và thử lại.';
  } finally {
    runBtn.disabled = false;
    bar.style.display = 'none';
  }
});

$('copy').addEventListener('click', async () => {
  await navigator.clipboard.writeText(out.value);
  status.textContent = 'Đã sao chép.';
});
$('save').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([out.value], { type: 'text/plain;charset=utf-8' }));
  a.download = 'ocr.txt';
  a.click();
});
</script>
</body>
</html>
