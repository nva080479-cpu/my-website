<style>
/* Layout: one centered study card under a compact control bar; the card is the only large object on the page. */
:root{

  --accent:#1B6B5E; --accent-ink:#FFFFFF; --seal:#B4322F; --soft:#E3EEEB; --back:#13213B; --back-ink:#F2F5FA; --back-muted:#A9B4C7;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1524; --surface:#172238; --ink:#EAF0FA; --muted:#98A5BB; --line:#2A3752;
  --accent:#4FC2AE; --accent-ink:#06201B; --seal:#F0827D; --soft:#18344A; --back:#E9EEF7; --back-ink:#13213B; --back-muted:#566178; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1524; --surface:#172238; --ink:#EAF0FA; --muted:#98A5BB; --line:#2A3752;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}

h1{font-family:var(--ko);font-size:1.5rem;margin:0;text-wrap:balance}

.count{color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 14px;font:inherit;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select,.chip{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-width:0;max-width:100%}
.chip{cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
button:focus-visible,select:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.stats{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.stage{perspective:1400px}
.card{position:relative;width:100%;min-height:360px;cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.2,1);border-radius:14px;outline-offset:4px}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:28px 22px;text-align:center;overflow:auto}
.front{background:var(--surface);border:1px solid var(--line)}
.back{background:var(--back);color:var(--back-ink);transform:rotateY(180deg)}
.tag{position:absolute;top:14px;left:18px;right:18px;display:flex;justify-content:space-between;gap:8px;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.back .tag{color:var(--back-muted)}
.big{font-size:2.2rem;line-height:1.25;font-weight:600;margin:0;overflow-wrap:anywhere;text-wrap:balance}
.big.ko{font-family:var(--ko);font-weight:700;font-size:2.6rem}
.hint{color:var(--muted);font-size:.8rem}
.ans{display:flex;flex-direction:column;gap:6px;align-items:center}
.ans .sub{color:var(--back-muted);font-size:.85rem}

.exko{font-family:var(--ko);font-size:1.2rem;margin:0;overflow-wrap:anywhere}
.exvi{margin:0;color:var(--back-muted);font-size:.9rem}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center}
.btn{font:inherit;font-weight:600;border-radius:10px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

.btn.know{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{min-width:96px}

</style>

const save=()=>{try{localStorage.setItem('hq-known',JSON.stringify(known))}catch(e){}};
const key=c=>c.l+'|'+c.ko;
const sel=$('lesson');
sel.innerHTML='<option value="all">Tất cả '+LESSONS.length+' bài ('+CARDS.length+' thẻ)</option>'+LESSONS.map((t,k)=>'<option value="'+k+'">'+t.replace(/ · .*? · /,' · ').replace(/</g,'&lt;')+'</option>').join('');
function mix(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function build(){
  let d=CARDS.filter(c=>lesson==='all'||c.l===+lesson);
  if(only)d=d.filter(c=>!known[key(c)]);
  deck=shuffle?mix(d):d; i=0; render(true);
}
function render(noAnim){
  const card=$('card'), has=deck.length>0;
  $('done').style.display=has?'none':'block';
  document.querySelector('.stage').hidden=!has; $('actions').hidden=!has; $('nav').hidden=!has;
  const scope=CARDS.filter(c=>lesson==='all'||c.l===+lesson);
  const k=scope.filter(c=>known[key(c)]).length;
  $('known').textContent='Đã thuộc '+k+'/'+scope.length;
  $('fill').style.width=(scope.length?k/scope.length*100:0)+'%';
  $('count').textContent=deck.length+' thẻ trong bộ';
  if(!has){$('pos').textContent='';return}
  const c=deck[i];
  const kv=dir==='kv';
  const apply=()=>{
    $('pos').textContent='Thẻ '+(i+1)+' / '+deck.length;
    const lt=LESSONS[c.l].split(' · ')[0];
    $('fTag').textContent=kv?'Hàn → Việt':'Việt → Hàn'; $('fSec').textContent=lt;
    $('bTag').textContent=kv?'Nghĩa tiếng Việt':'Tiếng Hàn'; $('bSec').textContent=c.s.split(' · ')[0];
    const fm=$('fMain'), bm=$('bMain');
    fm.textContent=kv?c.ko:c.vi; fm.className='big'+(kv?' ko':'');
    bm.textContent=kv?c.vi:c.ko; bm.className='big'+(kv?'':' ko');
    $('bSub').textContent=kv?(c.s.split(' · ')[1]||''):(c.s.split(' · ')[1]||'');
    $('exKo').textContent=c.ex; $('exVi').textContent=c.xv;
  };
  if(card.classList.contains('flip')&&!noAnim){
    card.classList.remove('flip'); setTimeout(apply,matchMedia('(prefers-reduced-motion:reduce)').matches?0:250);
  } else { card.classList.remove('flip'); apply(); }
}
const flip=()=>deck.length&&$('card').classList.toggle('flip');
const go=d=>{if(!deck.length)return;i=(i+d+deck.length)%deck.length;render()};
function mark(v){
  if(!deck.length)return; const c=deck[i];
  if(v)known[key(c)]=1; else delete known[key(c)]; save();
  if(only&&v){deck.splice(i,1); if(i>=deck.length)i=0; render()} else go(1);
}
$('card').onclick=flip;
$('card').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();flip()}};
$('prev').onclick=()=>go(-1); $('next').onclick=()=>go(1);
$('bKnow').onclick=()=>mark(true); $('bAgain').onclick=()=>mark(false);
$('dKV').onclick=()=>{dir='kv';$('dKV').setAttribute('aria-pressed','true');$('dVK').setAttribute('aria-pressed','false');render()};
$('dVK').onclick=()=>{dir='vk';$('dVK').setAttribute('aria-pressed','true');$('dKV').setAttribute('aria-pressed','false');render()};
sel.onchange=()=>{lesson=sel.value;build()};
$('shuf').onclick=e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle);build()};
$('only').onclick=e=>{only=!only;e.currentTarget.setAttribute('aria-pressed',only);build()};
$('reset').onclick=()=>{CARDS.filter(c=>lesson==='all'||c.l===+lesson).forEach(c=>delete known[key(c)]);save();only=false;$('only').setAttribute('aria-pressed','false');build()};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return;
  if(e.key===' '){e.preventDefault();flip()}
  else if(e.key==='ArrowRight')go(1); else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='1')mark(false); else if(e.key==='2')mark(true);
});
build();
</script>

</body></html>
